name: Run nf-test
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  release:
    types: [published]
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
  NXF_VER: "25.10.2"
  NFT_VER: "0.9.3"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity

jobs:
  # ---------------------------------------------------------------------------
  # Detect which pipelines have changed files and need testing
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect changed pipelines
    runs-on: ubuntu-latest
    outputs:
      ampliseq: ${{ steps.changes.outputs.ampliseq }}
      oncoanalyser: ${{ steps.changes.outputs.oncoanalyser }}
      dragen: ${{ steps.changes.outputs.dragen }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Check for changes per pipeline
        id: changes
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          for pipeline in ampliseq oncoanalyser dragen; do
            if git diff --quiet "$BASE_SHA" HEAD -- "$pipeline/"; then
              echo "${pipeline}=false" >> $GITHUB_OUTPUT
            else
              echo "${pipeline}=true" >> $GITHUB_OUTPUT
            fi
          done
          cat $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # ampliseq — 1 stub test (no containers needed)
  #   tests/modules/package_cbioportal.nf.test
  # ---------------------------------------------------------------------------
  ampliseq:
    name: "ampliseq"
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.ampliseq == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ampliseq
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFT_VER }}
          install-pdiff: true

      - name: Run ampliseq tests
        run: |
          nf-test test \
            tests/modules/package_cbioportal.nf.test \
            --profile test \
            --tap=test.tap

      - name: Generate test summary
        if: always()
        run: |
          echo "# ampliseq nf-test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test.tap ]; then
            while IFS= read -r line; do
              if [[ $line =~ ^ok ]]; then
                echo "- :white_check_mark: ${line#ok * }" >> $GITHUB_STEP_SUMMARY
              elif [[ $line =~ ^not\ ok ]]; then
                echo "- :x: ${line#not ok * }" >> $GITHUB_STEP_SUMMARY
              fi
            done < test.tap
          else
            echo "- :warning: No test results found" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # oncoanalyser — 14 tests across modules, subworkflows, and pipeline levels
  #
  # Pipeline tests:
  #   tests/clinical.nf.test              (R container)
  #   tests/incremental.nf.test           (R container)
  #
  # Subworkflow tests:
  #   tests/subworkflows/clinical_aggregate.nf.test       (R container)
  #   tests/subworkflows/genomic_cnv.nf.test              (R container)
  #   tests/subworkflows/genomic_expression.nf.test       (R container)
  #   tests/subworkflows/genomic_sv.nf.test               (R container)
  #   tests/subworkflows/genomic_ml.nf.test               (stub — no containers)
  #   tests/subworkflows/genomic_aggregate_output.nf.test (R container)
  #   tests/subworkflows/genomic_mutations.nf.test        (PCGR + vcf2maf — CI only)
  #
  # Module tests:
  #   tests/modules/isofox_fusion_to_cbioportal.nf.test   (R container)
  #   tests/modules/package_cbioportal.nf.test            (stub — no containers)
  #   tests/modules/sigprofiler_sbs.nf.test               (SigProfiler container)
  #   tests/modules/sigprofiler_dbs.nf.test               (SigProfiler container)
  #   tests/modules/sigprofiler_id.nf.test                (SigProfiler container)
  #   tests/modules/sigs_counts_to_cbioportal.nf.test     (R container)
  # ---------------------------------------------------------------------------
  oncoanalyser:
    name: "oncoanalyser | ${{ matrix.shard }}/${{ needs.oncoanalyser-shards.outputs.total_shards }}"
    needs: [detect-changes, oncoanalyser-shards]
    if: ${{ needs.oncoanalyser-shards.outputs.total_shards != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.oncoanalyser-shards.outputs.shard) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Run nf-test
        uses: ./.github/actions/nf-test
        env:
          NFT_DIFF: ${{ env.NFT_DIFF }}
          NFT_DIFF_ARGS: ${{ env.NFT_DIFF_ARGS }}
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
        with:
          profile: apptainer
          shard: ${{ matrix.shard }}
          total_shards: ${{ needs.oncoanalyser-shards.outputs.total_shards }}
          github_token: ${{ secrets.GH_PAT }}
          nxf_version: ${{ env.NXF_VER }}
          working_directory: oncoanalyser

  oncoanalyser-shards:
    name: oncoanalyser-shards
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.oncoanalyser == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      shard: ${{ steps.set-shards.outputs.shard }}
      total_shards: ${{ steps.set-shards.outputs.total_shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: get number of shards
        id: set-shards
        uses: ./.github/actions/get-shards
        env:
          NFT_VER: ${{ env.NFT_VER }}
        with:
          max_shards: 7
          working_directory: oncoanalyser

  # ---------------------------------------------------------------------------
  # dragen — 10 tests across modules, subworkflows, and pipeline levels
  #
  # Pipeline tests:
  #   tests/clinical.nf.test                              (R container)
  #   tests/genomic.nf.test                               (R + PCGR + vcf2maf)
  #
  # Subworkflow tests:
  #   tests/subworkflows/clinical_aggregate.nf.test       (R container)
  #   tests/subworkflows/genomic_cnv.nf.test              (R container)
  #   tests/subworkflows/genomic_expression.nf.test       (R container)
  #   tests/subworkflows/genomic_sv.nf.test               (R container)
  #   tests/subworkflows/genomic_ml.nf.test               (stub — no containers)
  #   tests/subworkflows/genomic_aggregate_output.nf.test (R container)
  #   tests/subworkflows/genomic_mutations.nf.test        (PCGR + vcf2maf — CI only)
  #
  # Module tests:
  #   tests/modules/package_cbioportal.nf.test            (stub — no containers)
  # ---------------------------------------------------------------------------
  dragen:
    name: "dragen | ${{ matrix.shard }}/${{ needs.dragen-shards.outputs.total_shards }}"
    needs: [detect-changes, dragen-shards]
    if: ${{ needs.dragen-shards.outputs.total_shards != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.dragen-shards.outputs.shard) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Run nf-test
        uses: ./.github/actions/nf-test
        env:
          NFT_DIFF: ${{ env.NFT_DIFF }}
          NFT_DIFF_ARGS: ${{ env.NFT_DIFF_ARGS }}
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
        with:
          profile: apptainer
          shard: ${{ matrix.shard }}
          total_shards: ${{ needs.dragen-shards.outputs.total_shards }}
          github_token: ${{ secrets.GH_PAT }}
          nxf_version: ${{ env.NXF_VER }}
          working_directory: dragen

  dragen-shards:
    name: dragen-shards
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.dragen == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      shard: ${{ steps.set-shards.outputs.shard }}
      total_shards: ${{ steps.set-shards.outputs.total_shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: get number of shards
        id: set-shards
        uses: ./.github/actions/get-shards
        env:
          NFT_VER: ${{ env.NFT_VER }}
        with:
          max_shards: 7
          working_directory: dragen

  # ---------------------------------------------------------------------------
  # Final gate — all pipeline jobs must pass
  # ---------------------------------------------------------------------------
  confirm-pass:
    needs: [ampliseq, oncoanalyser, dragen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: One or more tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: One or more tests cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All tests ok
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0

      - name: debug-print
        if: always()
        run: |
          echo "::group::DEBUG: needs contents"
          echo "DEBUG: toJSON(needs) = ${{ toJSON(needs) }}"
          echo "DEBUG: toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
          echo "::endgroup::"
